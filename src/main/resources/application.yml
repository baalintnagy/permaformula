server:
    port: 8086

springdoc:
    api-docs:
        # Keep the definition compatible with clients supporting OpenAPI 3.0.
        version: OPENAPI_3_0

permmath:
    host: "http://localhost:8086"
    image-cache:
        maximum-size: 1GB
        expire-after-write: 60d
    rendering:
        engine: javafx
        browser-directory: .runtime/browsers
        timeout: 30s

