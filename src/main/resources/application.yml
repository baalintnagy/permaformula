server:
    port: 8086

springdoc:
    api-docs:
        # Keep the definition compatible with clients supporting OpenAPI 3.0.
        version: OPENAPI_3_0

permmath:
    host: "http://localhost:8086"
    exception:
        allow-message: true
        allow-localized-message: true
        allow-exception-class: true
        allow-stacktrace: true

