services:
  renderer:
    build:
      context: .
      target: renderer
    init: true
    restart: on-failure
    network_mode: none
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/seccomp-chromium.json
    volumes:
      - render-socket:/run/permmath
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    shm_size: 256m
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    ulimits:
      core: 0
      nofile: {soft: 8192, hard: 8192}
    healthcheck:
      test: [CMD-SHELL, "test -S /run/permmath/render.sock"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  permmath:
    build:
      context: .
      target: runtime
    depends_on:
      renderer: {condition: service_healthy}
    init: true
    user: "10001:10001"
    group_add: ["10002"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - render-socket:/run/permmath:ro
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 256
    ulimits:
      core: 0
      nofile: {soft: 8192, hard: 8192}
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      PORT: "5000"
      PERMMATH_HOST: "${PERMMATH_HOST:-http://localhost:5000}"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  render-socket:
