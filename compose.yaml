services:
  stylesheet-egress:
    build: {context: ., dockerfile: docker/egress/Dockerfile, target: egress}
    init: true
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [api-private, stylesheet-public]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 32
    ulimits:
      core: 0
      nofile: {soft: 8192, hard: 8192}
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 3128"]
      interval: 5s
      timeout: 2s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  ingress:
    build: {context: ., dockerfile: docker/egress/Dockerfile, target: ingress}
    depends_on:
      permmath: {condition: service_started}
    init: true
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [api-private, ingress-public]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 32
    ports:
      - "127.0.0.1:${PORT:-5000}:8080"
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  renderer:
    build:
      context: .
      target: renderer
    init: true
    restart: on-failure
    network_mode: none
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/seccomp-chromium.json
    volumes:
      - render-socket:/run/permmath
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    shm_size: 512m
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 256
    ulimits:
      core: 0
      nofile: {soft: 8192, hard: 8192}
    healthcheck:
      test: [CMD-SHELL, "test -S /run/permmath/render.sock"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  permmath:
    build:
      context: .
      target: runtime
    depends_on:
      renderer: {condition: service_healthy}
      stylesheet-egress: {condition: service_healthy}
    init: true
    user: "10001:10001"
    group_add: ["10002"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - render-socket:/run/permmath:ro
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256
    ulimits:
      core: 0
      nofile: {soft: 8192, hard: 8192}
    networks: [api-private]
    environment:
      PORT: "5000"
      PERMMATH_HOST: "${PERMMATH_HOST:-http://localhost:5000}"
      PERMMATH_STYLESHEET_FETCH_PROXY_REQUIRED: "true"
      PERMMATH_STYLESHEET_FETCH_PROXY: "http://stylesheet-egress:3128"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  render-socket:
networks:
  api-private:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  stylesheet-public:
  ingress-public:
