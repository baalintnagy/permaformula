<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <meta name="referrer" content="no-referrer" />
        <title>PermaFormula - Formulae with style</title>
        <meta
            name="description"
            content="Create styled mathematical formulae. Preview, customize, and share permanent SVG and JPEG links with PermaFormula."
        />
        <meta property="og:title" content="PermaFormula - Formulae with style" />
        <meta
            property="og:description"
            content="Create styled mathematical formulae. Preview, customize, and share permanent SVG and JPEG links with PermaFormula."
        />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="PermaFormula" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="2400" />
        <meta property="og:image:height" content="1260" />
        <meta
            property="og:image:alt"
            content="PermaFormula - Formulae with style. Create, style, and share mathematical formulae."
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="PermaFormula - Formulae with style" />
        <meta
            name="twitter:description"
            content="Create styled mathematical formulae. Preview, customize, and share permanent SVG and JPEG links with PermaFormula."
        />
        <meta
            name="twitter:image:alt"
            content="PermaFormula - Formulae with style. Create, style, and share mathematical formulae."
        />
        <!-- PERMAFORMULA_PUBLIC_METADATA -->
        <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
        <script>
            try {
                const saved = localStorage.getItem('permaformula-theme-choice');
                document.documentElement.dataset.theme =
                    saved === 'light' || saved === 'dark'
                        ? saved
                        : matchMedia('(prefers-color-scheme: dark)').matches
                          ? 'dark'
                          : 'light';
            } catch {
                document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)')
                    .matches
                    ? 'dark'
                    : 'light';
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
