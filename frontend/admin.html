<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="referrer" content="no-referrer" />
        <title>PermaFormula - Cache administration</title>
        <style>
            html {
                background: #e2e3e8;
                color: #0b1422;
            }
            html[data-theme='dark'] {
                background: #121318;
                color: #e4e9f4;
            }
            body {
                margin: 0;
                font-family: Inter, 'Segoe UI', Arial, sans-serif;
            }
            #app-loading {
                display: none;
            }
            html[data-app-state='loading'] #root {
                visibility: hidden;
            }
            html[data-app-state='loading'] #app-loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                font-size: 13px;
            }
            .loading-spinner {
                width: 32px;
                height: 32px;
                border: 3px solid #b8bdc8;
                border-top-color: #496f9f;
                border-radius: 50%;
            }
            html[data-theme='dark'] .loading-spinner {
                border-color: #2a3448;
                border-top-color: #9bbfea;
            }
            @media (prefers-reduced-motion: no-preference) {
                .loading-spinner {
                    animation: app-spin 800ms linear infinite;
                }
                html[data-app-state='ready'] #root {
                    animation: app-reveal 500ms ease-out both;
                }
            }
            @keyframes app-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @keyframes app-reveal {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
        </style>
        <script>
            document.documentElement.dataset.appState = 'loading';
            try {
                const saved = localStorage.getItem('permaformula-theme-choice');
                document.documentElement.dataset.theme =
                    saved === 'light' || saved === 'dark'
                        ? saved
                        : matchMedia('(prefers-color-scheme: dark)').matches
                          ? 'dark'
                          : 'light';
            } catch {
                document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)')
                    .matches
                    ? 'dark'
                    : 'light';
            }
        </script>
    </head>
    <body>
        <div id="app-loading" role="status" aria-live="polite">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Loading PermaFormula…</span>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/admin.tsx"></script>
    </body>
</html>
