<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="referrer" content="no-referrer" />
        <title>PermaFormula - Cache administration</title>
        <script>
            try {
                const saved = localStorage.getItem('permaformula-theme-choice');
                document.documentElement.dataset.theme =
                    saved === 'light' || saved === 'dark'
                        ? saved
                        : matchMedia('(prefers-color-scheme: dark)').matches
                          ? 'dark'
                          : 'light';
            } catch {
                document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)')
                    .matches
                    ? 'dark'
                    : 'light';
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/admin.tsx"></script>
    </body>
</html>
