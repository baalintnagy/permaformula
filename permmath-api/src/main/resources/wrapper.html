<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/export-svg.js"></script>
<script>
window.renderState = 'loading';
window.MathJax = {
  loader: {load: ['input/asciimath']},
  startup: {
    pageReady: function () {
      return MathJax.startup.defaultPageReady().then(function () {
        return Promise.all([
          document.fonts.ready,
          Promise.all(Array.from(document.images).map(function (image) {
            if (image.complete) {
              if (!image.naturalWidth) throw new Error('Image failed: ' + image.src);
              return Promise.resolve();
            }
            return new Promise(function (resolve, reject) {
              image.addEventListener('load', resolve, {once: true});
              image.addEventListener('error', function () { reject(new Error('Image failed: ' + image.src)); }, {once: true});
            });
          }))
        ]);
      }).then(async function () {
        if (document.querySelector('mjx-merror')) throw new Error('Invalid math expression');
        window.renderSvg = await window.exportStyledSvg();
        window.renderState = 'ready';
      }).catch(function (error) {
        window.renderError = String(error);
        window.renderState = 'error';
      });
    }
  },
  svg: {fontCache: 'local'}
};
</script>
<script defer src="/mathjax/tex-svg.js" onerror="window.renderState='error';window.renderError='MathJax failed to load'"></script>
</head>
<body></body>
</html>
