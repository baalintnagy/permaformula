server:
    port: 8086
    # Identity is resolved by our explicit trusted-peer policy, before request parsing.
    forward-headers-strategy: none

springdoc:
    api-docs:
        # Keep the definition compatible with clients supporting OpenAPI 3.0.
        version: OPENAPI_3_0

permmath:
    rate-limit:
        requests-per-minute: 600
        request-burst: 120
        request-concurrency: 32
        generations-per-minute: 60
        generation-burst: 10
        generation-concurrency: 1
        maximum-clients: 100000
        expire-after-access: 1h
        trusted-proxies: []
    host: "http://localhost:8086"
    image-cache:
        maximum-size: 256MB
        expire-after-access: 60d
        persistence:
            # IDE/local launches need no external database. Compose overrides this to postgres.
            backend: sqlite
            sqlite-path: .runtime/image-cache.sqlite
            maximum-size: 2GB
            cleanup-interval: 5m
    api-work:
        preparation-concurrency: 4
        generation-concurrency: 2
        fetch-concurrency: 2
        timeout: 60s
    rendering:
        target: localhost:9090
        timeout: 45s

