server:
    port: 8086

springdoc:
    api-docs:
        # Keep the definition compatible with clients supporting OpenAPI 3.0.
        version: OPENAPI_3_0

permmath:
    host: "http://localhost:8086"
    image-cache:
        maximum-size: 256MB
        expire-after-access: 60d
    rendering:
        target: localhost:9090
        timeout: 30s

