worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off; # Permalinks/formulas must not be copied into ingress logs.
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 ipv6=off valid=10s;
    # Preserve the large permalink/request-line allowance. Buffers allocate on demand.
    large_client_header_buffers 2 12m;
    client_header_timeout ${PERMMATH_INGRESS_HEADER_TIMEOUT_SECONDS}s;
    client_body_timeout ${PERMMATH_INGRESS_BODY_TIMEOUT_SECONDS}s;
    send_timeout ${PERMMATH_INGRESS_SEND_TIMEOUT_SECONDS}s;
    keepalive_timeout ${PERMMATH_INGRESS_KEEPALIVE_TIMEOUT_SECONDS}s;
    keepalive_requests 1000;
    client_max_body_size 8m;
    # Shared across API and image listeners; forwarded headers cannot select keys.
    limit_conn_zone $binary_remote_addr zone=clients:8m;
    limit_conn_zone $server_addr zone=total:32k;
    limit_conn clients ${PERMMATH_INGRESS_CLIENT_CONNECTIONS};
    limit_conn total ${PERMMATH_INGRESS_TOTAL_CONNECTIONS};
    limit_conn_status 429;
    # nginx's default error log includes the request URI, including formula data.
    limit_conn_log_level info;
    map $limit_conn_status $ingress_retry_after { default ""; REJECTED "1"; }
    server {
        listen 8080;
        add_header Retry-After $ingress_retry_after always;
        location = /exp { return 307 "${PERMMATH_IMAGE_HOST}$request_uri"; }
        location = /html { return 307 "${PERMMATH_IMAGE_HOST}$request_uri"; }
        location = /url { include /etc/nginx/api-proxy.conf; }
        location = /url-encode { include /etc/nginx/api-proxy.conf; }
        location = /swagger-ui.html { include /etc/nginx/api-proxy.conf; }
        location /swagger-ui/ { include /etc/nginx/api-proxy.conf; }
        location = /v3/api-docs { include /etc/nginx/api-proxy.conf; }
        location /v3/api-docs/ { include /etc/nginx/api-proxy.conf; }
        location = / { include /etc/nginx/api-proxy.conf; }
        location = /index.html { include /etc/nginx/api-proxy.conf; }
        location /assets/ { include /etc/nginx/api-proxy.conf; }
        location /mathjax/ { include /etc/nginx/api-proxy.conf; }
        # Explicit API routes prevent alternate image spellings/path parameters
        # from reaching Spring through its more permissive path normalization.
        location / { return 404; }
    }
    server {
        listen 8081;
        add_header Retry-After $ingress_retry_after always;
        # Anonymous Swagger reads are allowed only from the configured API origin.
        add_header Access-Control-Allow-Origin "${PERMMATH_HOST}" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        location = /exp { include /etc/nginx/image-proxy.conf; }
        location = /html { include /etc/nginx/image-proxy.conf; }
        location / { return 404; }
    }
}
