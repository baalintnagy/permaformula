worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off; # Permalinks/formulas must not be copied into ingress logs.
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 ipv6=off valid=10s;
    large_client_header_buffers 2 12m;
    client_header_timeout 15s;
    server {
        listen 8080;
        location = /img { return 307 "${PERMMATH_IMAGE_HOST}$request_uri"; }
        location = /image { return 307 "${PERMMATH_IMAGE_HOST}$request_uri"; }
        location = /url { include /etc/nginx/api-proxy.conf; }
        location = /decode { include /etc/nginx/api-proxy.conf; }
        location = /swagger-ui.html { include /etc/nginx/api-proxy.conf; }
        location /swagger-ui/ { include /etc/nginx/api-proxy.conf; }
        location = /v3/api-docs { include /etc/nginx/api-proxy.conf; }
        location /v3/api-docs/ { include /etc/nginx/api-proxy.conf; }
        # Explicit API routes prevent alternate image spellings/path parameters
        # from reaching Spring through its more permissive path normalization.
        location / { return 404; }
    }
    server {
        listen 8081;
        # Anonymous Swagger reads are allowed only from the configured API origin.
        add_header Access-Control-Allow-Origin "${PERMMATH_HOST}" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        location = /img { include /etc/nginx/image-proxy.conf; }
        location = /image { include /etc/nginx/image-proxy.conf; }
        location / { return 404; }
    }
}
