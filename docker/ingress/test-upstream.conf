# Test-only HTTP fixture using native nginx variables; never copied into the runtime image.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 32; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 5000;
        add_header Set-Cookie "session=fixture; HttpOnly" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        location / {
            default_type text/plain;
            return 200 "$http_cookie|$http_authorization|$http_proxy_authorization|$http_x_permmath_image_delivery";
        }
    }
}
