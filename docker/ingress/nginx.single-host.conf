worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 256;
}
http {
    include /tmp/trusted-proxy.conf;
    access_log off; # Permalinks/formulae must not be copied into ingress logs.
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 ipv6=off valid=10s;
    # Preserve the large permalink/request-line allowance. Buffers allocate on demand.
    large_client_header_buffers 2 20m;
    client_header_timeout ${PERMAFORMULA_INGRESS_HEADER_TIMEOUT_SECONDS}s;
    client_body_timeout ${PERMAFORMULA_INGRESS_BODY_TIMEOUT_SECONDS}s;
    send_timeout ${PERMAFORMULA_INGRESS_SEND_TIMEOUT_SECONDS}s;
    keepalive_timeout ${PERMAFORMULA_INGRESS_KEEPALIVE_TIMEOUT_SECONDS}s;
    keepalive_requests 1000;
    client_max_body_size 8m;
    # Shared across API and image listeners; forwarded headers cannot select keys.
    limit_conn_zone $binary_remote_addr zone=clients:8m;
    limit_conn_zone $server_addr zone=total:32k;
    limit_conn clients ${PERMAFORMULA_INGRESS_CLIENT_CONNECTIONS};
    limit_conn total ${PERMAFORMULA_INGRESS_TOTAL_CONNECTIONS};
    limit_conn_status 429;
    # nginx's default error log includes the request URI, including formula data.
    limit_conn_log_level info;
    map $limit_conn_status $ingress_retry_after {
        default "";
        REJECTED "1";
    }
    server {
        listen 8080;
        add_header Retry-After $ingress_retry_after always;
        location = /exp-svg {
            include /etc/nginx/image-proxy.conf;
        }
        location = /exp-jpg {
            include /etc/nginx/image-proxy.conf;
        }
        location = /html-svg {
            include /etc/nginx/image-proxy.conf;
        }
        location = /html-jpg {
            include /etc/nginx/image-proxy.conf;
        }
        location = /library-items {
            include /etc/nginx/api-proxy.conf;
        }
        location = /library-item {
            include /etc/nginx/api-proxy.conf;
        }
        location = /admin.html {
            include /etc/nginx/api-proxy.conf;
        }
        location = /admin/cache-item {
            include /etc/nginx/api-proxy.conf;
        }
        location = /admin/login {
            include /etc/nginx/api-proxy.conf;
        }
        location = /ubcq-decode {
            include /etc/nginx/api-proxy.conf;
        }
        location = /ubcq {
            include /etc/nginx/api-proxy.conf;
        }
        location = /swagger-ui.html {
            include /etc/nginx/api-proxy.conf;
        }
        location /swagger-ui/ {
            include /etc/nginx/api-proxy.conf;
        }
        location = /v3/api-docs {
            include /etc/nginx/api-proxy.conf;
        }
        location /v3/api-docs/ {
            include /etc/nginx/api-proxy.conf;
        }
        location = / {
            include /etc/nginx/api-proxy.conf;
        }
        location = /index.html {
            include /etc/nginx/api-proxy.conf;
        }
        location /assets/ {
            include /etc/nginx/api-proxy.conf;
        }
        location /mathjax/ {
            include /etc/nginx/api-proxy.conf;
        }
        # Explicit API routes prevent alternate image spellings/path parameters
        # from reaching Spring through its more permissive path normalization.
        location / {
            return 404;
        }
    }
}
